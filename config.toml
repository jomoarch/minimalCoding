base = "."

[compiler]
source = "src"
args = ["g++", "-std=c++17", "-O2", "-Wall", "-Wextra"]
force_rebuild = false

[inject]
enabled = true
header = "inject/probe.h"

[runner]
time_limit_ms = 1000
memory_limit_mb = 256
status_line = true
status_interval_ms = 100

[io]
single_input = "input"
single_output = "output"
merge_stderr = false
print_input = false
colorize_output = true
